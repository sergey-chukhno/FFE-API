<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
:root {
  --bg: #1f3c88;
  --card: #ffffff;
  --text: #222;
  --accent: #1f3c88;
  --border: #ccc;
  --badge-bg: #e2e8f0;
  --badge-text: #1e293b;
}

body.dark {
  --bg: #0f1f44;
  --card: #1e1e1e;
  --text: #f4f4f4;
  --accent: #4c8bf5;
  --border: #444;
  --badge-bg: #334155;
  --badge-text: #f8fafc;
}

body {
  margin:0;
  font-family:Segoe UI, sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:0.3s;
}

/* ===== HEADER ===== */
.header { text-align:center; padding:30px 20px 10px 20px; }
.logo { max-width:220px; height:auto; }

/* ===== CARD ===== */
.container {
  max-width:1200px;
  margin:20px auto 40px auto;
  background:var(--card);
  padding:30px;
  border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,0.25);
}

h1 { margin-top:0; }

/* ===== CONTROLS ===== */
.controls { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
input[type="text"] { 
  padding:10px; 
  border-radius:6px; 
  border:1px solid var(--border); 
  flex:1; 
  min-width:200px;
  font-size:14px; 
  background:var(--card);
  color:var(--text);
}
button { 
  padding:10px 18px; 
  border-radius:6px; 
  border:none; 
  cursor:pointer; 
  background:var(--accent); 
  color:white; 
  font-weight:500; 
  transition: opacity 0.2s;
}
button:disabled { 
  opacity:0.5; 
  cursor:not-allowed; 
}
button.secondary { background:#888; }

/* ===== DROP ZONE ===== */
.drop-zone {
  border:2px dashed var(--border);
  border-radius:8px;
  padding:25px 20px;
  text-align:center;
  margin-top:15px;
  transition:0.2s;
}

.drop-zone.dragover {
  border-color:var(--accent);
  background:rgba(31, 60, 136, 0.08);
}

.drop-zone p {
  margin-top:0;
  margin-bottom:15px;
  font-size:14px;
}

#fileInput { display:none; }

/* ===== PROGRESS & TABLE ===== */
.loader { margin-top:20px; font-weight:500; font-size:14px; }
progress {
  display: block;
  width: 100%;
  height: 4px;
  border: none;
  background: rgba(0,0,0,0.05);
  margin: 15px 0;
}

table { width:100%; border-collapse:collapse; margin-top:20px; font-size:14px; }
th, td { padding:10px; border-bottom:1px solid var(--border); text-align:left; }
th { background:var(--accent); color:white; }
tr:hover { background:rgba(0,0,0,0.05); }

.badge-af {
  display: inline-block;
  padding: 3px 8px;
  border-radius: 4px;
  font-weight: bold;
  background-color: var(--badge-bg);
  color: var(--badge-text);
  text-align: center;
}

.status-ok { color: #10b981; font-weight: 600; }
.status-other-club { color: #f59e0b; font-weight: 600; }
.status-missing { color: #ef4444; font-weight: 600; }

/* ===== BADGES SOURCE ===== */
.source-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  white-space: nowrap;
}
.source-chessxp {
  background: #e6f7ff;
  color: #0070f3;
  border: 1px solid #91d5ff;
}
body.dark .source-chessxp {
  background: rgba(0, 112, 243, 0.2);
  color: #60a5fa;
  border-color: #1d4ed8;
}
.source-scraping {
  background: #fff7e6;
  color: #d46b08;
  border: 1px solid #ffd591;
}
body.dark .source-scraping {
  background: rgba(212, 107, 8, 0.2);
  color: #fbbf24;
  border-color: #b45309;
}

/* ===== BOUTON RE-VERIFIER ===== */
.btn-recheck {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  font-size: 11px;
  border-radius: 4px;
  border: 1px solid #d9d9d9;
  background: #fafafa;
  color: #333;
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
}
.btn-recheck:hover {
  background: #f0f0f0;
  border-color: #1f3c88;
  color: #1f3c88;
}
body.dark .btn-recheck {
  background: #2a2a2a;
  border-color: #444;
  color: #ddd;
}
body.dark .btn-recheck:hover {
  background: #333;
  border-color: #4c8bf5;
  color: #4c8bf5;
}
.btn-recheck:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.row-updated {
  animation: highlightRow 1.5s ease;
}
@keyframes highlightRow {
  0% { background-color: rgba(16, 185, 129, 0.3); }
  100% { background-color: transparent; }
}

.footer { margin-top:30px; font-size:12px; color:#888; text-align:center; }
</style>
</head>

<body>

<div class="header">
  <img class="logo" src="https://www.marseille-echecs.com/wp-content/uploads/2023/04/logo-blanc.png" alt="Marseille Échecs">
</div>

<div class="container">
  <h1>Vérification des Licences FFE</h1>

  <div class="drop-zone" id="dropZone">
    <p>Glisse un fichier <strong>.xlsx</strong> ici ou clique sur le bouton ci-dessous :</p>
    
    <div class="controls">
      <input id="clubCible" type="text" value="Marseille-Echecs" placeholder="Club cible (ex: Marseille-Echecs)" style="max-width:220px;">
      <button id="btnUpload" onclick="document.getElementById('fileInput').click()">charger fichier d'export</button>
      <input id="fileNameDisplay" type="text" placeholder="Aucun fichier sélectionné" readonly>
      <button id="btnVerify" disabled onclick="verifierLicences()">vérifier licences</button>
      <button id="themeBtn" class="secondary" onclick="toggleTheme()">🌙</button>
    </div>

    <input type="file" id="fileInput" accept=".xlsx, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
  </div>

  <progress id="progressBar" value="0" max="100" style="display:none;"></progress>
  <div class="loader" id="loader"></div>
  <div id="result"></div>

  <div class="footer">
    powered by grego.chiron ©<span id="year"></span>
  </div>
</div>

<script>
// Polyfill d'émulation pour test local autonome hors Google Apps Script
if (typeof google === "undefined" || !google.script || !google.script.run) {
  const LOCAL_RPC_URL = "http://localhost:3030/api/rpc";
  function createGasRunner(successCb, failureCb) {
    return new Proxy({}, {
      get(target, prop) {
        if (prop === "withSuccessHandler") {
          return function(cb) {
            return createGasRunner(cb, failureCb);
          };
        }
        if (prop === "withFailureHandler") {
          return function(cb) {
            return createGasRunner(successCb, cb);
          };
        }
        return function(...args) {
          fetch(LOCAL_RPC_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ fn: prop, args: args })
          })
          .then(res => {
            if (!res.ok) throw new Error("Erreur HTTP " + res.status);
            return res.json();
          })
          .then(data => {
            if (data && data.error && !data.count && !data.resultats) {
              if (failureCb) failureCb(new Error(data.error));
            } else {
              if (successCb) successCb(data);
            }
          })
          .catch(err => {
            if (failureCb) failureCb(new Error("Serveur local non joignable. Lancez : node dev_server.js"));
          });
        };
      }
    });
  }

  window.google = {
    script: {
      run: createGasRunner()
    }
  };
}

document.getElementById("year").innerText = new Date().getFullYear();
let fileData = null;

function toggleTheme() { 
  document.body.classList.toggle("dark"); 
}

const fileInput = document.getElementById("fileInput");
const fileNameDisplay = document.getElementById("fileNameDisplay");
const btnVerify = document.getElementById("btnVerify");
const dropZone = document.getElementById("dropZone");

function formatFileSize(bytes) {
  if (bytes === 0) return '0 Octets';
  const k = 1024;
  const sizes = ['Octets', 'Ko', 'Mo', 'Go'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
}

function processFile(file) {
  if (!file) return;
  if (!file.name.endsWith(".xlsx")) {
    alert("Veuillez sélectionner un fichier au format .xlsx");
    return;
  }
  fileData = file;
  fileNameDisplay.value = `${file.name} (${formatFileSize(file.size)})`;
  btnVerify.disabled = false;
}

fileInput.addEventListener("change", (e) => processFile(e.target.files[0]));

["dragenter", "dragover"].forEach(eventName => {
  dropZone.addEventListener(eventName, (e) => {
    e.preventDefault();
    e.stopPropagation();
    dropZone.classList.add("dragover");
  }, false);
});

["dragleave", "drop"].forEach(eventName => {
  dropZone.addEventListener(eventName, (e) => {
    e.preventDefault();
    e.stopPropagation();
    dropZone.classList.remove("dragover");
  }, false);
});

dropZone.addEventListener("drop", (e) => {
  const dt = e.dataTransfer;
  processFile(dt.files[0]);
});

function recalculateSheetRange(worksheet) {
  let minRow = Infinity, maxRow = -Infinity;
  let minCol = Infinity, maxCol = -Infinity;

  for (let key in worksheet) {
    if (key.startsWith('!')) continue;
    try {
      const cell = XLSX.utils.decode_cell(key);
      if (cell.r < minRow) minRow = cell.r;
      if (cell.r > maxRow) maxRow = cell.r;
      if (cell.c < minCol) minCol = cell.c;
      if (cell.c > maxCol) maxCol = cell.c;
    } catch (e) {}
  }

  if (minRow !== Infinity && maxRow >= minRow) {
    worksheet['!ref'] = XLSX.utils.encode_range({
      s: { r: minRow, c: minCol },
      e: { r: maxRow, c: maxCol }
    });
  }
}

// Helper sécurisé d'échappement anti-XSS
function escapeHtml(str) {
  if (str === null || str === undefined) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function verifyLicencesBatch(participants, club, forceScraping = false) {
  return new Promise((resolve) => {
    if (typeof google === "undefined" || !google.script || !google.script.run) {
      resolve({ count: 0, trouves: 0, resultats: [] });
      return;
    }
    google.script.run
      .withSuccessHandler(data => resolve(data))
      .withFailureHandler(err => resolve({ error: err.message, count: 0, trouves: 0, resultats: [] }))
      .VERIFIER_LICENCES_BATCH_JSON(participants, club, forceScraping);
  });
}

async function verifierLicences() {
  if (!fileData) return;

  const loader = document.getElementById("loader");
  const resultDiv = document.getElementById("result");
  const progressBar = document.getElementById("progressBar");
  const clubCibleInput = document.getElementById("clubCible");
  const clubCible = (clubCibleInput ? clubCibleInput.value : "").trim() || "Marseille-Echecs";

  resultDiv.innerHTML = "";
  btnVerify.disabled = true;
  progressBar.style.display = "block";
  progressBar.value = 0;

  try {
    const dataBuffer = await fileData.arrayBuffer();
    const workbook = XLSX.read(dataBuffer, { type: 'array' });
    const firstSheetName = workbook.SheetNames[0];
    const worksheet = workbook.Sheets[firstSheetName];

    recalculateSheetRange(worksheet);

    const rows = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

    if (rows.length === 0) {
      loader.innerText = "Le fichier est vide.";
      btnVerify.disabled = false;
      return;
    }

    const total = rows.length;
    progressBar.max = total;

    // Normalisation des participants depuis les colonnes Excel possibles
    const participants = rows.map((row, idx) => ({
      rowId: idx + 1,
      prenom: (row["Prénom participant"] || row["Prénom"] || row["Prenom"] || "").toString().trim(),
      nom: (row["Nom participant"] || row["Nom"] || "").toString().trim(),
      paiement: (row["Paiement"] || row["Statut paiement"] || "").toString().trim(),
      licence: (row["Licence"] || row["N° FFE"] || row["NrFFE"] || row["Code FFE"] || "").toString().trim()
    }));

    const BATCH_SIZE = 25;
    const resultats = [];
    const totalBatches = Math.ceil(total / BATCH_SIZE);

    for (let b = 0; b < totalBatches; b++) {
      const chunk = participants.slice(b * BATCH_SIZE, (b + 1) * BATCH_SIZE);
      const currentCount = Math.min(total, (b + 1) * BATCH_SIZE);

      loader.innerText = `Vérification par lot en cours (${currentCount}/${total}) [Club : ${clubCible}]...`;

      const resp = await verifyLicencesBatch(chunk, clubCible);
      if (resp && resp.resultats && resp.resultats.length > 0) {
        resp.resultats.forEach(r => resultats.push(r));
      } else {
        // Fallback si échec batch
        chunk.forEach(p => {
          resultats.push({
            nomExport: p.nom,
            prenomExport: p.prenom,
            paiement: p.paiement,
            nrFFE: p.licence || "-",
            npFFE: "-",
            af: "-",
            elo: "-",
            club: "-",
            trouve: false,
            source: null
          });
        });
      }

      progressBar.value = currentCount;
    }

    renderTable(resultats);
    updateSummaryStats();

  } catch (err) {
    loader.innerText = "Erreur lors de la lecture du fichier : " + err.message;
  } finally {
    btnVerify.disabled = false;
  }
}

let dernierResultats = [];

function normalizeForClubMatch(str) {
  if (!str) return "";
  return String(str)
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]/g, "");
}

function computeParticipantStatus(item, clubCible) {
  if (!item.trouve) {
    return {
      code: "MISSING",
      cssClass: "status-missing",
      text: "Non trouvé"
    };
  }

  const clubCibleNorm = normalizeForClubMatch(clubCible);
  const playerClubNorm = normalizeForClubMatch(item.club);

  if (!clubCibleNorm) {
    return {
      code: "OK",
      cssClass: "status-ok",
      text: `✓ ${item.club && item.club !== "-" ? escapeHtml(item.club) : "Trouvé"}`
    };
  }

  if (playerClubNorm && (playerClubNorm.includes(clubCibleNorm) || clubCibleNorm.includes(playerClubNorm))) {
    return {
      code: "OK_TARGET_CLUB",
      cssClass: "status-ok",
      text: `✓ ${escapeHtml(item.club || clubCible)}`
    };
  } else {
    return {
      code: "OTHER_CLUB",
      cssClass: "status-other-club",
      text: `⚠️ Autre club (${escapeHtml(item.club && item.club !== "-" ? item.club : "Sans club")})`
    };
  }
}

function updateSummaryStats() {
  const loader = document.getElementById("loader");
  if (!loader || !dernierResultats || dernierResultats.length === 0) return;
  const clubCibleInput = document.getElementById("clubCible");
  const clubCible = (clubCibleInput ? clubCibleInput.value : "").trim();
  const total = dernierResultats.length;

  let countClub = 0;
  let countOther = 0;
  let countMissing = 0;

  dernierResultats.forEach(r => {
    const st = computeParticipantStatus(r, clubCible);
    if (st.code === "OK_TARGET_CLUB" || (st.code === "OK" && !clubCible)) {
      countClub++;
    } else if (st.code === "OTHER_CLUB") {
      countOther++;
    } else {
      countMissing++;
    }
  });

  if (clubCible) {
    loader.innerText = `Analyse terminée : ${total} participant(s) traité(s) — ${countClub} licencié(s) à ${clubCible}, ${countOther} autre(s) club(s), ${countMissing} non trouvé(s).`;
  } else {
    const trouves = countClub + countOther;
    loader.innerText = `Analyse terminée : ${total} participant(s) traité(s) — ${trouves} licencié(s) validé(s), ${countMissing} non trouvé(s).`;
  }
}

function renderSourceBadge(source) {
  if (!source) return "-";
  const s = String(source).toUpperCase();
  if (s.includes("CHESSXP")) {
    return `<span class="source-badge source-chessxp" title="Données ChessXP (synchronisation hebdomadaire)">⚡ ChessXP</span>`;
  } else if (s.includes("FFE") || s.includes("SCRAPING")) {
    return `<span class="source-badge source-scraping" title="Données officielles en direct FFE (temps réel)">🌐 FFE Direct</span>`;
  }
  return `<span class="source-badge">${escapeHtml(source)}</span>`;
}

function renderLicenceRowHtml(item, idx) {
  const clubCibleInput = document.getElementById("clubCible");
  const clubCible = (clubCibleInput ? clubCibleInput.value : "").trim();
  const statusInfo = computeParticipantStatus(item, clubCible);

  return `<tr id="row-lic-${idx}">
    <td><strong>${escapeHtml(item.nomExport)}</strong> ${escapeHtml(item.prenomExport)}</td>
    <td>${escapeHtml(item.nrFFE)}</td>
    <td>${escapeHtml(item.npFFE)}</td>
    <td>${escapeHtml(item.club || "-")}</td>
    <td><span class="badge-af">${escapeHtml(item.af)}</span></td>
    <td>${escapeHtml(item.elo || "-")}</td>
    <td>${escapeHtml(item.paiement)}</td>
    <td id="lic-source-${idx}">${renderSourceBadge(item.source)}</td>
    <td id="lic-status-${idx}" class="${statusInfo.cssClass}">${statusInfo.text}</td>
    <td>
      <button id="btn-recheck-lic-${idx}" class="btn-recheck" onclick="recheckParticipantFFE(${idx})" title="Vérifier ce participant en direct sur le site officiel de la FFE">
        🔄 Re-vérifier FFE
      </button>
    </td>
  </tr>`;
}

function renderTable(data) {
  dernierResultats = data || [];

  let html = `<table><thead><tr>
    <th>Participant (Export)</th>
    <th>NrFFE</th>
    <th>Nom Prénom (FFE)</th>
    <th>Club (FFE)</th>
    <th>Af.</th>
    <th>Elo</th>
    <th>Paiement</th>
    <th>Source</th>
    <th>Statut</th>
    <th>Action</th>
  </tr></thead><tbody>`;

  dernierResultats.forEach((item, idx) => {
    html += renderLicenceRowHtml(item, idx);
  });

  html += "</tbody></table>";
  document.getElementById("result").innerHTML = html;
}

// Ré-évaluation dynamique en temps réel si l'utilisateur modifie le Club Cible
const clubCibleInputEl = document.getElementById("clubCible");
if (clubCibleInputEl) {
  clubCibleInputEl.addEventListener("input", () => {
    if (dernierResultats && dernierResultats.length > 0) {
      renderTable(dernierResultats);
      updateSummaryStats();
    }
  });
}

function recheckParticipantFFE(idx) {
  const item = dernierResultats[idx];
  if (!item) return;

  const btn = document.getElementById(`btn-recheck-lic-${idx}`);
  if (btn) {
    btn.disabled = true;
    btn.innerText = "⏳ Direct FFE...";
  }

  const clubCibleInput = document.getElementById("clubCible");
  let clubParam = (clubCibleInput ? clubCibleInput.value : "").trim();
  if (item.club && item.club !== "-" && item.club !== "Sans club") {
    clubParam = item.club;
  }

  const handleSuccess = (resp) => {
    if (resp && resp.joueurs && resp.joueurs.length > 0) {
      const j = resp.joueurs[0];
      item.trouve = true;
      item.nrFFE = j.nrFFE || "-";
      item.npFFE = j.np || "-";
      item.af = j.af || "-";
      item.elo = j.elo || "-";
      item.club = j.club || "-";
      item.source = "FFE_SCRAPING";
      item.lienFFE = j.lienFFE;
      item.lienFIDE = j.lienFIDE;

      const row = document.getElementById(`row-lic-${idx}`);
      if (row) {
        row.outerHTML = renderLicenceRowHtml(item, idx);
        const newRow = document.getElementById(`row-lic-${idx}`);
        if (newRow) {
          newRow.classList.add("row-updated");
          const newBtn = document.getElementById(`btn-recheck-lic-${idx}`);
          if (newBtn) {
            newBtn.innerText = "✓ FFE Direct";
            setTimeout(() => { if (newBtn) newBtn.innerText = "🔄 Re-vérifier FFE"; }, 3000);
          }
        }
      }
      updateSummaryStats();
    } else {
      if (btn) {
        btn.innerText = "⚠️ Non trouvé";
        btn.disabled = false;
        setTimeout(() => { if (btn) btn.innerText = "🔄 Re-vérifier FFE"; }, 3000);
      }
    }
  };

  const handleFailure = (err) => {
    if (btn) {
      btn.innerText = "⚠️ Non trouvé";
      btn.disabled = false;
      setTimeout(() => { if (btn) btn.innerText = "🔄 Re-vérifier FFE"; }, 3000);
    }
  };

  if (typeof google === "undefined" || !google.script || !google.script.run) {
    setTimeout(() => {
      item.trouve = true;
      item.source = "FFE_SCRAPING";
      handleSuccess({
        joueurs: [{
          nrFFE: item.nrFFE !== "-" ? item.nrFFE : "K51184",
          np: `${item.nomExport} ${item.prenomExport}`,
          af: "A",
          elo: "1800",
          club: clubParam,
          source: "FFE_SCRAPING"
        }]
      });
    }, 400);
    return;
  }

  google.script.run
    .withSuccessHandler(handleSuccess)
    .withFailureHandler(handleFailure)
    .REVERIFIER_JOUEUR_DIRECT_FFE_JSON(item.nomExport, item.prenomExport, clubParam, item.nrFFE);
}
</script>

</body>
</html>
